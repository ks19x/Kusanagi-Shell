name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container: ubuntu:24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Git
        run: apt-get update && apt-get install -y git ca-certificates
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check version
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "v$(cat VERSION)" = "$GITHUB_REF_NAME"
          fi
      - name: Build dependencies
        run: bash packaging/portable/build-deps.sh
      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: /root/.cache/ccache
          key: portable-gcc14-${{ github.sha }}
          restore-keys: portable-gcc14-
      - name: Check portable launchers
        run: python3 packaging/portable/test_portable.py
      - name: Build portable bundle
        run: bash packaging/portable/build.sh
      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /root/.cache/ccache
          key: portable-gcc14-${{ github.sha }}-${{ github.run_attempt }}-${{ github.run_id }}
      - name: Collect bundled library sources
        run: bash packaging/portable/library-sources.sh
      - uses: actions/upload-artifact@v4
        with:
          name: kusanagi-linux-x86_64
          path: |
            dist/*.tar.xz
            dist/SHA256SUMS
          if-no-files-found: error

  smoke:
    needs: portable
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'debian:13', 'fedora:43', 'archlinux:latest']
    container: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install host graphics and PAM libraries
        run: |
          if command -v apt-get; then
            apt-get update
            apt-get install -y --no-install-recommends xz-utils libegl1 libgles2 libpam0g python3 procps
          elif command -v dnf; then
            dnf install -y xz mesa-libEGL libglvnd-gles pam python3 procps-ng
          else
            pacman -Syu --noconfirm --needed xz libglvnd pam python procps-ng
          fi
      - uses: actions/download-artifact@v4
        with:
          name: kusanagi-linux-x86_64
          path: dist
      - name: Check the same archive on this distribution
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          tar -xf kusanagi-*-linux-x86_64.tar.xz
          bundle=$(find "$PWD" -maxdepth 1 -type d -name 'kusanagi-*-linux-x86_64')
          "$bundle/usr/bin/kusanagi-shell" --help
          "$bundle/usr/bin/kusanagi-shell" --version
          "$bundle/kusanagi" version
          "$bundle/usr/bin/kusanagi-shell" --portable-ldd | tee /tmp/kusanagi-libraries.txt
          if grep -q 'not found' /tmp/kusanagi-libraries.txt; then exit 1; fi
          # Moving the bundle must not break its library paths.
          mv "$bundle" "$PWD/relocated bundle"
          "$PWD/relocated bundle/usr/bin/kusanagi-shell" --version
          "$PWD/relocated bundle/kusanagi" version

  session:
    needs: portable
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'debian:13', 'fedora:43', 'archlinux:latest']
    container: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    steps:
      # The shell draws through the system's own Mesa here, so a newer driver than Ubuntu's shows
      # up as a failure instead of only in someone's real session.
      - name: Install a headless Wayland session
        run: |
          if command -v apt-get; then
            apt-get update
            apt-get install -y --no-install-recommends git ca-certificates xz-utils sway dbus-daemon \
              libegl1 libgles2 libgl1-mesa-dri libpam0g fonts-dejavu-core python3 procps
          elif command -v dnf; then
            dnf install -y git xz sway dbus-daemon mesa-libEGL mesa-dri-drivers libglvnd-gles pam \
              dejavu-sans-fonts python3 procps-ng shadow-utils util-linux
          else
            pacman -Syu --noconfirm --needed git xz sway dbus mesa libglvnd pam ttf-dejavu python \
              procps-ng shadow util-linux
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: kusanagi-linux-x86_64
          path: dist
      - name: Start the shell and check IPC
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          tar -xf kusanagi-*-linux-x86_64.tar.xz
          bundle=$(find "$PWD" -maxdepth 1 -type d -name 'kusanagi-*-linux-x86_64')
          useradd --create-home tester
          chmod -R a+rX "$GITHUB_WORKSPACE"
          # Some distros give sway file capabilities, which a CI container refuses to exec.
          install -m 755 "$(command -v sway)" /usr/local/bin/sway
          runuser -u tester -- env PATH="/usr/local/bin:$PATH" dbus-run-session -- timeout 45 \
            bash "$GITHUB_WORKSPACE/packaging/portable/smoke-session.sh" "$bundle"

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [smoke, session]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: kusanagi-linux-x86_64
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          body_path: packaging/RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.xz
            dist/SHA256SUMS
