# Kusanagi for Hyprland (classic hyprland.conf) — autostart + keybinds.
# install.sh adds `source = ~/.config/hypr/kusanagi.conf` to hyprland.conf.
exec-once = kusanagi
bind = SUPER, SPACE, exec, kusanagi msg launcher toggle
bind = SUPER, A, exec, kusanagi msg wallpaper toggle
bind = SUPER, V, exec, kusanagi msg clipboard toggle
bind = SUPER, N, exec, kusanagi msg notifs toggle
bind = SUPER, I, exec, kusanagi msg settings toggle
bind = SUPER, L, exec, kusanagi msg lock lock
bind = SUPER, G, exec, kusanagi msg gamemode toggle
bind = SUPER, GRAVE, exec, kusanagi msg power toggle
bind = , Print, exec, kusanagi screenshot full
bind = SUPER SHIFT, S, exec, kusanagi screenshot region
bind = SUPER SHIFT, C, exec, kusanagi colorpick
