# Kusanagi for MangoWM — autostart + keybinds. install.sh adds `source=./kusanagi.conf` to config.conf.
exec-once=kusanagi
bind=SUPER,space,spawn,kusanagi msg launcher toggle
bind=SUPER,a,spawn,kusanagi msg wallpaper toggle
bind=SUPER,v,spawn,kusanagi msg clipboard toggle
bind=SUPER,n,spawn,kusanagi msg notifs toggle
bind=SUPER,i,spawn,kusanagi msg settings toggle
bind=SUPER,l,spawn,kusanagi msg lock lock
bind=SUPER,g,spawn,kusanagi msg gamemode toggle
bind=SUPER,grave,spawn,kusanagi msg power toggle
bind=NONE,Print,spawn,kusanagi screenshot full
bind=SUPER+SHIFT,s,spawn,kusanagi screenshot region
bind=SUPER+SHIFT,c,spawn,kusanagi colorpick
