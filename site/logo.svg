<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Kusanagi: a K run through by the grass-cutting sword -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1c22"/>
      <stop offset="1" stop-color="#0c0d10"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0343c"/>
      <stop offset="1" stop-color="#8e1520"/>
    </linearGradient>
    <linearGradient id="k" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9d4ca"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d96a3"/>
      <stop offset="0.45" stop-color="#e9edf2"/>
      <stop offset="0.55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b9c1cc"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0cf78"/>
      <stop offset="1" stop-color="#9c7526"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="300" cy="228" r="150" fill="url(#sun)"/>

  <!-- K: stem + upper arm (the sword passes in front of these) -->
  <g fill="url(#k)">
    <rect x="104" y="96" width="86" height="320" rx="6"/>
    <path d="M190 214 L330 96 L436 96 L190 306 Z"/>
  </g>

  <!-- the sword, tilted, tip down -->
  <g transform="translate(300 0) rotate(14 0 256)">
    <rect x="-17" y="10" width="34" height="18" rx="6" fill="url(#gold)"/>
    <rect x="-15" y="26" width="30" height="114" rx="5" fill="#9e1b24"/>
    <g fill="#16171b">
      <path d="M0 34 L13 46 L0 58 L-13 46 Z"/>
      <path d="M0 60 L13 72 L0 84 L-13 72 Z"/>
      <path d="M0 86 L13 98 L0 110 L-13 98 Z"/>
      <path d="M0 112 L13 124 L0 136 L-13 124 Z"/>
    </g>
    <ellipse cx="0" cy="148" rx="44" ry="12" fill="url(#gold)" stroke="#4a3610" stroke-width="2"/>
    <rect x="-14" y="158" width="28" height="16" rx="2" fill="url(#gold)"/>
    <path d="M-13 172 L13 172 L13 436 Q13 472 -13 500 Z" fill="url(#steel)"/>
    <path d="M7 182 Q12 202 7 222 Q2 242 8 262 Q13 282 7 302 Q2 322 8 342 Q13 362 7 382 Q3 402 8 422 Q10 446 3 476"
          fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="2"/>
  </g>

  <!-- lower leg drawn last: the blade disappears behind it = stuck through -->
  <path d="M232 268 L300 214 L440 416 L338 416 Z" fill="url(#k)"/>
</svg>
